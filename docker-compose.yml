services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-faceauth}
      POSTGRES_USER: ${POSTGRES_USER:-faceauth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faceauth -d faceauth"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
  backend:
    build: {context: ., dockerfile: infra/docker/backend.Dockerfile}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-faceauth}:${POSTGRES_PASSWORD:-local-only}@db:5432/${POSTGRES_DB:-faceauth}
      REDIS_URL: redis://redis:6379/0
      USE_QUANTUM: ${USE_QUANTUM:-false}
      QUANTUM_BACKEND: ${QUANTUM_BACKEND:-simulator}
      KMS_KEY_PATH: /data/template.key
      JWT_PRIVATE_KEY_PATH: /data/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /data/jwt_public.pem
      CORS_ORIGINS: http://localhost
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    volumes: ["keydata:/data"]
    ports: ["8000:8000"]
  frontend:
    build: {context: ./frontend, dockerfile: Dockerfile}
    depends_on: [backend]
  nginx:
    build: {context: ./infra/nginx, dockerfile: Dockerfile}
    ports: ["80:80"]
    depends_on: [frontend, backend]
volumes: {pgdata: {}, redisdata: {}, keydata: {}}
