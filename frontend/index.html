<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1110" />
    <title>Identity Access</title>
    <style>
      html, body { min-height: 100%; margin: 0; background: #0b1110; }
      #initial-loader { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; color: #e7f0ec; background: radial-gradient(ellipse at 50% 42%, #17302b 0, #101a18 30%, #0b1110 72%); font: 500 13px/1.5 system-ui, sans-serif; }
      #initial-loader::before, #initial-loader::after { position: absolute; width: 34rem; height: 34rem; border: 1px solid #9be3ca0d; border-radius: 50%; content: ''; animation: loader-orbit 28s linear infinite; }
      #initial-loader::after { width: 25rem; height: 25rem; animation-direction: reverse; }
      #initial-loader .loader-card { position: relative; z-index: 1; display: grid; justify-items: center; width: min(82vw, 350px); }
      #initial-loader .loader-visual { position: relative; display: grid; place-items: center; width: 138px; height: 138px; margin-bottom: 25px; border: 1px solid #a1e8d522; border-radius: 50%; background: radial-gradient(circle, #28544744, #10201b22 65%, transparent 66%); box-shadow: 0 0 80px #5fceaa19; }
      #initial-loader .loader-visual::before, #initial-loader .loader-visual::after { position: absolute; inset: 10px; border: 1px dashed #9be3ca3b; border-radius: 50%; content: ''; animation: loader-orbit 16s linear infinite; }
      #initial-loader .loader-visual::after { inset: 24px; border-style: solid; border-color: #9be3ca17; animation-direction: reverse; }
      #initial-loader .loader-visual svg { position: relative; z-index: 1; width: 94px; height: 112px; overflow: visible; filter: drop-shadow(0 0 8px #78efcb55); }
      #initial-loader .loader-visual path { fill: #62d5b00a; stroke: #9be3ca9c; stroke-width: 1; stroke-dasharray: 450; stroke-dashoffset: 450; animation: loader-trace 1.3s .15s ease-out forwards; }
      #initial-loader .loader-visual circle { fill: #a5ebd2; filter: drop-shadow(0 0 3px #6fffd0); animation: loader-dots .4s .5s ease-out both; }
      #initial-loader .loader-beam { position: absolute; z-index: 2; left: 16%; right: 16%; top: 13%; height: 1px; background: linear-gradient(90deg, transparent, #a5ebd2, transparent); box-shadow: 0 0 12px #85d6bd; animation: loader-scan 1.55s ease-in-out infinite; }
      #initial-loader .loader-kicker { color: #85d6bd; font: 10px/1.5 ui-monospace, monospace; letter-spacing: .24em; }
      #initial-loader .loader-title { margin-top: 7px; font-size: 19px; font-weight: 600; letter-spacing: -.025em; }
      #initial-loader .loader-caption { margin-top: 5px; color: #81928c; font-size: 12px; }
      #initial-loader .loader-track { width: 100%; height: 3px; margin-top: 28px; overflow: hidden; border-radius: 10px; background: #ffffff13; }
      #initial-loader .loader-track::after { display: block; width: 35%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #6fbca5, #ddfff2); box-shadow: 0 0 12px #75e6c277; content: ''; animation: loader-progress 1.5s cubic-bezier(.4,0,.2,1) forwards; }
      @keyframes loader-orbit { to { transform: rotate(360deg); } }
      @keyframes loader-trace { to { stroke-dashoffset: 0; } }
      @keyframes loader-dots { from { opacity: 0; } to { opacity: .9; } }
      @keyframes loader-scan { 0% { top: 12%; opacity: 0; } 15% { opacity: .9; } 85% { opacity: .9; } 100% { top: 88%; opacity: 0; } }
      @keyframes loader-progress { from { transform: translateX(-110%); } to { transform: translateX(300%); } }
      @media (prefers-reduced-motion: reduce) { #initial-loader::before, #initial-loader::after, #initial-loader .loader-visual::before, #initial-loader .loader-visual::after, #initial-loader .loader-visual path, #initial-loader .loader-visual circle, #initial-loader .loader-beam, #initial-loader .loader-track::after { animation-duration: .01ms; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" role="status" aria-label="Preparing identity access">
        <div class="loader-card">
          <div class="loader-visual" aria-hidden="true">
            <svg viewBox="0 0 100 120"><path d="M50 5 C24 5 12 25 14 53 C15 81 30 105 50 114 C70 105 85 81 86 53 C88 25 76 5 50 5Z M23 44 Q36 32 49 44 Q36 56 23 44Z M51 44 Q64 32 77 44 Q64 56 51 44Z M50 46 L46 69 L50 76 L55 69 M39 89 Q50 96 61 89"/><circle cx="14" cy="53" r="2"/><circle cx="23" cy="44" r="2"/><circle cx="36" cy="44" r="2"/><circle cx="49" cy="44" r="2"/><circle cx="51" cy="44" r="2"/><circle cx="64" cy="44" r="2"/><circle cx="77" cy="44" r="2"/><circle cx="86" cy="53" r="2"/><circle cx="50" cy="76" r="2"/><circle cx="39" cy="89" r="2"/><circle cx="61" cy="89" r="2"/></svg>
            <span class="loader-beam"></span>
          </div>
          <span class="loader-kicker">IDENTITY ACCESS</span>
          <strong class="loader-title">Preparing secure access</strong>
          <span class="loader-caption">Getting your workspace ready</span>
          <div class="loader-track" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
