server {
  listen 80;
  server_name localhost;
  client_max_body_size 6m;
  client_body_buffer_size 64k;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:" always;
  location /api/ { proxy_pass http://backend:8000/api/; proxy_set_header Host $host; proxy_request_buffering off; }
  location / { proxy_pass http://frontend:80; }
}

server {
  listen 443 ssl;
  server_name localhost;
  client_max_body_size 6m;
  client_body_buffer_size 64k;
  ssl_certificate /etc/nginx/certs/dev.crt;
  ssl_certificate_key /etc/nginx/certs/dev.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:" always;
  location /api/ { proxy_pass http://backend:8000/api/; proxy_set_header Host $host; proxy_request_buffering off; }
  location / { proxy_pass http://frontend:80; }
}
