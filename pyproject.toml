[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-face-auth"
version = "0.1.0"
description = "CPU-first biometric authentication research demo"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6", "pydantic-settings>=2.2",
  "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1", "redis>=5.0",
  "cryptography>=42", "argon2-cffi>=23", "PyJWT[crypto]>=2.8", "numpy>=1.26", "email-validator>=2.1",
  "opencv-python-headless>=4.9,<5", "scikit-learn>=1.4", "Pillow>=10", "webauthn>=2.6,<3"
]

[project.optional-dependencies]
vision = ["torch>=2.2", "facenet-pytorch>=2.6", "mediapipe>=0.10"]
quantum = ["qiskit>=1.0", "qiskit-aer>=0.14", "pennylane>=0.36"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.3", "black>=24"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]
